<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Check Record Plans</title>
  <link rel="stylesheet" href="../css/index.css">
  <link rel="stylesheet" href="../css/CheckRecordPlans.css">
  <link rel="stylesheet" href="../css/language-dropdown.css" />
  <style>
    .go-back-container {
      margin-top: 50px;
      margin-right: 50px;
      margin-left: 50px;
    }

    .go-back-btn {
      background-color: #468201;
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 5px;
      font-size: 1.2em;
      cursor: pointer;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
    }

    .go-back-btn:hover {
      background-color: #356601;
    }

    .weight-scale-container {
      margin: 20px 50px;
    }

    .weight-scale {
      display: flex;
      justify-content: space-between;
      position: relative;
    }

    .weight-label {
      font-weight: bold;
    }

    .weight-tick {
      height: 2px;
      background-color: black;
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
    }

    .weight-tick:nth-child(2) { left: 20%; }
    .weight-tick:nth-child(4) { left: 40%; }
    .weight-tick:nth-child(6) { left: 60%; }
    .weight-tick:nth-child(8) { left: 80%; }

    .y-axis-scale {
      position: absolute;
      left: -40px; /* Adjust based on your layout */
      top: 0;
      bottom: 0;
      width: 40px; /* Adjust based on your layout */
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 5px 0;
    }

    .y-label {
      font-weight: bold;
      position: relative;
    }

    .y-label::after {
      content: '';
      position: absolute;
      width: 100%;
      height: 2px;
      background-color: black;
      top: 50%;
      transform: translateY(-50%);
      z-index: -1;
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- Navigation Bar -->
    <div class="header">
      <nav class="nav">
        <a href="index.html" id="logo">
          <img src="../images/Logo.png" alt="Logo" style="width: 100px; height: auto; padding-left: 30px;">
        </a>
        <a href="./RecordPlans.html" class="nav-link">Record Plans</a>
        <a href="./WorkoutPlans.html" class="nav-link">Workout Plans</a>
        <a href="./Exercises.html" class="nav-link">List Of Exercises</a>
        <a href="./Favourites.html" class="nav-link">Favourites</a>
        
        <div class="language-dropdown">
          <a href="../#" class="nav-link language">Language</a>
          <div class="dropdown-content">
            <a href="#" class="language-option" data-lang="pt">
              <img src="../images/portugal.png" alt="Português" class="flag-icon"> Português
            </a>
            <a href="#" class="language-option" data-lang="en">
              <img src="../images/united-kingdom.png" alt="English" class="flag-icon"> English
            </a>
          </div>
        </div>
        
        <a href="../myProfile.html" id="profile">
          <img src="../images/profilings.jpg" alt="Logo" style="width: 100px; height: auto; padding-left: 30px;">
        </a>
      </nav>                       
    </div>

    <div class="main-area">
      <div class="go-back-container">
        <button onclick="goBack()" class="go-back-btn">&#8592;</button>
        <h1 class="page-title" id="plan-title">Check Record Plans</h1>
      </div>

      <div class="graphic-area">
        
        <div class="exercise-grid" id="exercise-grid">
          <!-- Exercise cards or your graphic go here -->
        </div>
      </div>
    </div>
  </div>
  <script src="../js/CheckRecords.js"></script>
  <script>
    function goBack() {
      window.history.back();
    }
  </script>
  <script src="../js/language-dropdown.js"></script>
</body>
</html>
