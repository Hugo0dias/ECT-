<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OneBox - Home</title>
    <link rel="stylesheet" href="../css/index.css">
    <link rel="stylesheet" href="../css/feature.css">
    <link rel="stylesheet" href="../css/RecordPlan.css">
    <link rel="stylesheet" href="../css/language-dropdown.css" />

    <!-- sync data between pages! -->
    <script src="../js/syncData.js"></script>
    <script src="../js/feature.js" defer></script>
</head>
<body>
    <div class="container">
      <div class="header">
        <nav class="nav">
          <a href="index.html" id="logo">
            <img src="../images/Logo.png" alt="Logo" style="width: 100px; height: auto; padding-left: 30px;">
          </a>
          <a href="RecordPlans.html" class="nav-link">Record Plans</a>
          <a href="WorkoutPlans.html" class="nav-link">Workout Plans</a>
          <a href="Exercises.html" class="nav-link">List Of Exercises</a>
          <a href="Favourites.html" class="nav-link">Favourites</a>
          
          <div class="language-dropdown">
            <a href="../#" class="nav-link language">Language</a>
            <div class="dropdown-content">
              <a href="#" class="language-option" data-lang="pt">
                <img src="../images/portugal.png" alt="Português" class="flag-icon"> Português
              </a>
              <a href="#" class="language-option" data-lang="en">
                <img src="../images/united-kingdom.png" alt="English" class="flag-icon"> English
              </a>
            </div>
          </div>
          
          <a href="myProfile.html" id="profile">
            <img src="../images/profilings.jpg" alt="Logo" style="width: 100px; height: auto; padding-left: 30px;">
          </a>
        </nav>                       
      </div>
        <div class="main-layout">
          <div class="go-back-container">
            <button onclick="goBack()" class="go-back-btn">
              &#8592; <!-- Left-pointing arrow -->
            </button>
          </div>
            <aside class="sidebar">
                <h2>Filtros</h2>
                <form class="filter-list">
                    <label><input type="checkbox" name="filter" value="recently-used"> Recently Used</label>
                    <label><input type="checkbox" name="filter" value="least-used"> Least Used</label>
                    <label><input type="checkbox" name="filter" value="most-used"> Most Used</label>
                    <label><input type="checkbox" name="filter" value="newest-added"> Newest Added</label>
                    <label><input type="checkbox" name="filter" value="oldest-added"> Oldest Added</label>
                    <label><input type="checkbox" name="filter" value="az"> A-Z</label>
                    <label><input type="checkbox" name="filter" value="workouts"> Workouts</label>
                    <label><input type="checkbox" name="filter" value="exercise-plan"> Exercise Plan</label>
                </form>
            </aside>
            
            
        
            <section class="content-area">
                <div class="page-header">
                    <a href="../html/Create_Record_Plan.html?new=true" class="page-title-btn">Create Record Plan</a>
                </div>
        
                <div class="content-box" id="record-plans-container" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 20px;">
                    <!-- Saved plans will be dynamically added here -->
                </div>
            </section>
        </div>

        <script>
          function goBack() {
            window.location.href = "index.html";
          }
        </script>
        
        <script>
          function displayRecordPlans() {
            const recordPlans = JSON.parse(localStorage.getItem('recordPlans')) || [];
            const container = document.getElementById('record-plans-container');
        
            container.innerHTML = ''; // Clear the container
        
            if (recordPlans.length === 0) {
              container.innerHTML = '<p>No record plans found. Create one now!</p>';
              return;
            }
        
            recordPlans.forEach((plan, index) => {
              const div = document.createElement('div');
              div.className = 'plan-card-hover content-box';
                div.style.border = '1px solid #ccc';
                div.style.padding = '15px';
                div.style.borderRadius = '10px';
                div.style.background = '#f9fff5'; // Move background here
                div.style.boxShadow = '0 2px 12px rgba(70,130,1,0.08)';
                div.style.minHeight = '100px'; // Reduce height
                div.style.display = 'flex';
                div.style.flexDirection = 'column';
                div.style.alignItems = 'center';
                div.style.justifyContent = 'center';
                div.style.transition = 'box-shadow 0.2s';

                div.innerHTML = `
                    <h3 style="color: #468201; margin-top:10px; margin-bottom: 24px; font-size: 1.5em; text-align: center;">${plan.title}</h3>
                    <div style="display: flex; gap: 10px;">
                  <button onclick="viewPlan(${index})" style="background-color: #468201; color: white; border: none; padding: 4px 10px; border-radius: 6px; cursor: pointer; font-weight: 500; font-size: 1.1em; transition: background 0.2s;">Register</button>
                  <button onclick="goToCheckRecord(${index})" style="background-color: #FF8000; color: white; border: none; padding: 4px 10px; border-radius: 6px; cursor: pointer; font-weight: 500; font-size: 0.95em; transition: background 0.2s;">Check</button>
                  <button onclick="deletePlan(${index})" style="background-color: #e74c3c; color: white; border: none; padding: 4px 10px; border-radius: 6px; cursor: pointer; font-weight: 500; font-size: 0.95em; transition: background 0.2s;">Delete</button>
                </div>
              `;
              container.appendChild(div);
            });
          }
        
          function viewPlan(index) {
            const recordPlans = JSON.parse(localStorage.getItem('recordPlans')) || [];
            const plan = recordPlans[index];
            localStorage.setItem('currentPlan', JSON.stringify(plan)); // Save the current plan to localStorage
            window.location.href = `RecordPlanDetails.html?planIndex=${index}`; // Redirect to the plan details page
          }
        
          function goToCheckRecord(index) {
            const recordPlans = JSON.parse(localStorage.getItem('recordPlans')) || [];
            const plan = recordPlans[index];
            localStorage.setItem('currentPlan', JSON.stringify(plan)); // Save the current plan to localStorage
            window.location.href = `CheckRecords.html?planIndex=${index}`; // Redirect to the check record page
          }
        
          function deletePlan(index) {
            const recordPlans = JSON.parse(localStorage.getItem('recordPlans')) || [];
            recordPlans.splice(index, 1); // Remove the plan by index
            localStorage.setItem('recordPlans', JSON.stringify(recordPlans));
            displayRecordPlans(); // Refresh the list
          }
        
          window.onload = displayRecordPlans;
        </script>
    </div>
    <script src="../js/language-dropdown.js"></script>

</body>
</html>
