<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Workout Plan</title>
  <link rel="stylesheet" href="../css/index.css">
  <link rel="stylesheet" href="../css/Create_Record_Plan.css"> <!-- Reuse existing CSS -->
  <link rel="stylesheet" href="../css/Create_Workout_Plan.css"> <!-- New CSS file -->
  <link rel="stylesheet" href="../css/language-dropdown.css" />
</head>
<body>
  <div class="container">
    <!-- Header -->
    <div class="header">
      <nav class="nav">
        <a href="index.html" id="logo">
          <img src="../images/Logo.png" alt="Logo" style="width: 100px; height: auto; padding-left: 30px;">
        </a>
        <a href="./RecordPlans.html" class="nav-link">Record Plans</a>
        <a href="./WorkoutPlans.html" class="nav-link">Workout Plans</a>
        <a href="./Exercises.html" class="nav-link">List Of Exercises</a>
        <a href="./Favourites.html" class="nav-link">Favourites</a>
        
        <div class="language-dropdown">
          <a href="../#" class="nav-link language">Language</a>
          <div class="dropdown-content">
            <a href="#" class="language-option" data-lang="pt">
              <img src="../images/portugal.png" alt="Português" class="flag-icon"> Português
            </a>
            <a href="#" class="language-option" data-lang="en">
              <img src="../images/united-kingdom.png" alt="English" class="flag-icon"> English
            </a>
          </div>
        </div>
        
        <a href="../myProfile.html" id="profile">
          <img src="../images/profilings.jpg" alt="Logo" style="width: 100px; height: auto; padding-left: 30px;">
        </a>
      </nav>                       
    </div>

    <!-- Main Content -->
    <div class="main-area">
      <!-- Title Input -->
      <div class="go-back-container">
        <button onclick="goBack()" class="go-back-btn">
          &#8592; <!-- Left-pointing arrow -->
        </button>
        <div style="display: flex; justify-content: center; gap: 20px; margin-top: 20px; margin-bottom: 30px; padding-left: 1100px">
        <button class="page-title-btn" onclick="saveWorkoutPlan()">Save Workout Plan</button>
      </div>
      </div>
      <div class="content-box" style="text-align: center;">
        <h1 style="color: #468201; font-size: 2em; margin-bottom: 20px;">Create Your Workout Plan</h1>
        <input 
          id="workout-title" 
          type="text" 
          placeholder="Enter the workout plan name" 
          style="font-size: 1.5em; padding: 15px; width: 80%; border-radius: 10px; border: 2px solid #468201; text-align: center;"
        />
      </div>

      <!-- Exercise List -->
      <div id="exercise-list" class="content-box">
        <!-- Dynamically populated exercise list -->
      </div>

      <!-- Submit Button -->
      <div style="display: flex; justify-content: center; gap: 20px; margin-top: 30px; margin-bottom: 30px;">
        <button class="page-title-btn" onclick="redirectToExercises()">Add Exercise +</button>
        <button class="page-title-btn" onclick="saveWorkoutPlan()">Save Workout Plan</button>
      </div>
    </div>
  </div>

  <script>
    function goBack() {
      window.history.back();
    }
  </script>
  
  <script>
    function displayExercises() {
      const titleInput = document.getElementById('workout-title');
      const savedTitle = localStorage.getItem('workoutPlanTitle');
      if (savedTitle) {
        titleInput.value = savedTitle; // Restore the saved title
      }

      const list = document.getElementById('exercise-list');
      list.innerHTML = ''; // Clear the list before recreating it

      const savedExercises = JSON.parse(localStorage.getItem('workoutExercises')) || [];

      savedExercises.forEach((exercise, index) => {
        const savedData = JSON.parse(localStorage.getItem(`exerciseData-${index}`)) || {
          sets: '',
          reps: '',
          weight: '',
          rest: '',
          notes: '',
        };

        const div = document.createElement('div');
        div.className = 'exercise-block';
        div.innerHTML = `
          <button class="remove-btn" onclick="removeExercise(${index})">-</button>
          <div class="exercise-details">
            <div class="exercise-header">
              <img src="${exercise.img}" alt="${exercise.name}">
              <h3>${exercise.name}</h3>
            </div>
            <div class="inputs">
              <label>Sets: <input type="number" id="sets-${index}" min="1" value="${savedData.sets}" onchange="saveExerciseData(${index})"></label>
              <label>Reps: <input type="number" id="reps-${index}" min="1" value="${savedData.reps}" onchange="saveExerciseData(${index})"></label>
              <label>Weight (kg): <input type="number" id="weight-${index}" min="0" value="${savedData.weight}" onchange="saveExerciseData(${index})"></label>
            </div>
            <div class="notes">
              <label>Notes: <textarea id="notes-${index}" placeholder="No notes provided" onchange="saveExerciseData(${index})">${savedData.notes}</textarea></label>
            </div>
          </div>
          <div class="exercise-rest">
            <label>Rest Time (min): <input type="number" id="rest-${index}" min="0" step="0.1" value="${savedData.rest}" onchange="saveExerciseData(${index})"></label>
          </div>
        `;
        list.appendChild(div);
      });

      // Scroll to the last exercise if there is at least one
      const exerciseBlocks = list.querySelectorAll('.exercise-block');
      if (exerciseBlocks.length > 0) {
        exerciseBlocks[exerciseBlocks.length - 1].scrollIntoView({ behavior: 'smooth', block: 'center' });
      }
    }

    function saveExerciseData(index) {
      const sets = document.getElementById(`sets-${index}`).value;
      const reps = document.getElementById(`reps-${index}`).value;
      const weight = document.getElementById(`weight-${index}`).value;
      const rest = document.getElementById(`rest-${index}`).value;
      const notes = document.getElementById(`notes-${index}`).value;

      const exerciseData = { sets, reps, weight, rest, notes };
      localStorage.setItem(`exerciseData-${index}`, JSON.stringify(exerciseData));
    }

    function removeExercise(index) {
      const savedExercises = JSON.parse(localStorage.getItem('workoutExercises')) || [];
      savedExercises.splice(index, 1); // Remove the exercise by index
      localStorage.setItem('workoutExercises', JSON.stringify(savedExercises));
      localStorage.removeItem(`exerciseData-${index}`); // Remove the saved data for this exercise
      displayExercises(); // Update the list visually
    }

    function resetWorkoutPlanData() {
      localStorage.removeItem('workoutPlanTitle'); // Clear the workout plan title
      localStorage.removeItem('workoutExercises'); // Clear the list of exercises
      const savedExercises = JSON.parse(localStorage.getItem('workoutExercises')) || [];
      savedExercises.forEach((_, index) => {
        localStorage.removeItem(`exerciseData-${index}`); // Clear individual exercise data
      });
    }

    function startNewWorkoutPlan() {
      resetWorkoutPlanData(); // Clear all relevant data
      window.location.href = "Create_Workout_Plan.html"; // Redirect to the Create Workout Plan page
    }

    // Save the workout plan title dynamically
    function saveTitle() {
      const titleInput = document.getElementById('workout-title');
      localStorage.setItem('workoutPlanTitle', titleInput.value);
    }

    // Redirect to the Exercises page to add an exercise
    function redirectToExercises() {
      saveTitle();
      const savedExercises = JSON.parse(localStorage.getItem('workoutExercises')) || [];
      const newExerciseIndex = savedExercises.length;
      localStorage.setItem(`exerciseData-${newExerciseIndex}`, JSON.stringify({
        sets: '',
        reps: '',
        weight: '',
        rest: '',
        notes: '',
      }));
      window.location.href = "Exercises.html?from=createWorkoutPlan";
    }

    // Save the workout plan
    function saveWorkoutPlan() {
      const title = document.getElementById('workout-title').value.trim();
      if (!title) {
        alert('Please enter a title for your workout plan.');
        return;
      }

      const workoutPlans = JSON.parse(localStorage.getItem('workoutPlans')) || [];

      // Check if a workout plan with the same title already exists
      const isDuplicate = workoutPlans.some(plan => plan.title.toLowerCase() === title.toLowerCase());
      if (isDuplicate) {
        alert('A workout plan with this title already exists. Please choose a different title.');
        return;
      }

      const savedExercises = JSON.parse(localStorage.getItem('workoutExercises')) || [];
      if (savedExercises.length === 0) {
        alert('Please add at least one exercise to your workout plan.');
        return;
      }

      // Validate that all inputs (Sets, Reps, Weight) are filled
      for (let i = 0; i < savedExercises.length; i++) {
        const sets = document.getElementById(`sets-${i}`).value.trim();
        const reps = document.getElementById(`reps-${i}`).value.trim();
        const weight = document.getElementById(`weight-${i}`).value.trim();

        if (!sets || !reps || !weight) {
          alert(`Please fill in all fields (Sets, Reps, Weight) for exercise ${savedExercises[i].name}.`);
          return;
        }
      }

      // Add additional details for each exercise
      const exercisesWithDetails = savedExercises.map((exercise, index) => ({
        ...exercise,
        sets: document.getElementById(`sets-${index}`).value || 0,
        reps: document.getElementById(`reps-${index}`).value || 0,
        weight: document.getElementById(`weight-${index}`).value || 0,
        rest: document.getElementById(`rest-${index}`).value || 0,
        notes: document.getElementById(`notes-${index}`).value || '',
      }));

      // Add the new workout plan
      workoutPlans.push({ title, exercises: exercisesWithDetails });

      // Save the updated workout plans back to localStorage
      localStorage.setItem('workoutPlans', JSON.stringify(workoutPlans));
      
      // Clear the selected exercises and reset the title input
      localStorage.removeItem('workoutExercises');
      localStorage.removeItem('workoutPlanTitle');
      document.getElementById('workout-title').value = '';

      // Redirect to the Workout Plans page
      window.location.href = "WorkoutPlans.html";
    }

    // Load the exercises and restore the title when the page loads
    window.onload = () => {
      const isNewPlan = !localStorage.getItem('workoutPlanTitle') && !localStorage.getItem('workoutExercises');
      if (isNewPlan) {
        resetWorkoutPlanData(); // Clear all relevant data
      }
      displayExercises(); // Initialize the page
    };
  </script>
  <script src="../js/language-dropdown.js"></script>
</body>
</html>
