<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Workout Plans</title>
    <link rel="stylesheet" href="../css/index.css">
    <link rel="stylesheet" href="../css/feature.css">
    <link rel="stylesheet" href="../css/RecordPlan.css">
    <script src="../js/syncData.js"></script>
    <script src="../js/feature.js" defer></script>
    <link rel="stylesheet" href="../css/language-dropdown.css" />

</head>
<body>
    <div class="container">
        <div class="header">
            <nav class="nav">
              <a href="index.html" id="logo">
                <img src="../images/Logo.png" alt="Logo" style="width: 100px; height: auto; padding-left: 30px;">
              </a>
              <a href="RecordPlans.html" class="nav-link">Record Plans</a>
              <a href="WorkoutPlans.html" class="nav-link">Workout Plans</a>
              <a href="Exercises.html" class="nav-link">List Of Exercises</a>
              <a href="Favourites.html" class="nav-link">Favourites</a>
              
              <div class="language-dropdown">
                <a href="../#" class="nav-link language">Language</a>
                <div class="dropdown-content">
                  <a href="#" class="language-option" data-lang="pt">
                    <img src="../images/portugal.png" alt="Português" class="flag-icon"> Português
                  </a>
                  <a href="#" class="language-option" data-lang="en">
                    <img src="../images/united-kingdom.png" alt="English" class="flag-icon"> English
                  </a>
                </div>
              </div>
              
              <a href="myProfile.html" id="profile">
                <img src="../images/profilings.jpg" alt="Logo" style="width: 100px; height: auto; padding-left: 30px;">
              </a>
            </nav>                       
          </div>
        <div class="main-layout">
            <div class="go-back-container">
                <button onclick="goBack()" class="go-back-btn">
                  &#8592; <!-- Left-pointing arrow -->
                </button>
              </div>
            <aside class="sidebar">
                <h2>Filtros</h2>
                <form class="filter-list">
                    <label><input type="checkbox" name="filter" value="recently-used"> Recently Used</label>
                    <label><input type="checkbox" name="filter" value="least-used"> Least Used</label>
                    <label><input type="checkbox" name="filter" value="most-used"> Most Used</label>
                    <label><input type="checkbox" name="filter" value="newest-added"> Newest Added</label>
                    <label><input type="checkbox" name="filter" value="oldest-added"> Oldest Added</label>
                    <label><input type="checkbox" name="filter" value="az"> A-Z</label>
                    <label><input type="checkbox" name="filter" value="workouts"> Workouts</label>
                    <label><input type="checkbox" name="filter" value="exercise-plan"> Exercise Plan</label>
                </form>
            </aside>
            
            <section class="content-area">
                <div class="page-header">
                    <a href="../html/Create_Workout_Plan.html" class="page-title-btn">Create Workout Plan</a>
                </div>
        
                <div class="content-box" id="record-plans-container" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 20px;">
                    <!-- Saved plans will be dynamically added here -->
                </div>
            </section>
        </div>
    </div>


    <script>
        function goBack() {
            window.location.href = "index.html";
          }
      </script>
      
    <script>
        function displayWorkoutPlans() {
            const container = document.getElementById('record-plans-container');
            container.innerHTML = ''; // Clear the container before adding new content

            const workoutPlans = JSON.parse(localStorage.getItem('workoutPlans')) || [];

            if (workoutPlans.length === 0) {
                container.innerHTML = '<p style="text-align: center; color: #666;">No workout plans created yet.</p>';
                return;
            }

            workoutPlans.forEach((plan, index) => {
                const div = document.createElement('div');
                div.className = 'content-box';
                div.style.border = '1px solid #ccc';
                div.style.padding = '15px';
                div.style.borderRadius = '10px';
                div.style.background = '#f9fff5'; // Move background here
                div.style.boxShadow = '0 2px 12px rgba(70,130,1,0.08)';
                div.style.minHeight = '100px'; // Reduce height
                div.style.display = 'flex';
                div.style.flexDirection = 'column';
                div.style.alignItems = 'center';
                div.style.justifyContent = 'center';
                div.style.transition = 'box-shadow 0.2s';

                div.innerHTML = `
                    <h3 style="color: #468201; margin-top:10px; margin-bottom: 24px; font-size: 1.3em; text-align: center;">${plan.title}</h3>
                    <div style="display: flex; gap: 10px;">
                        <button onclick="redirectToDetails(${index}, false)" style="background-color: #468201; color: white; border: none; padding: 8px 18px; border-radius: 6px; cursor: pointer; font-weight: 1000; transition: background 0.2s;">View</button>
                        <button onclick="redirectToDetails(${index}, true)" style="background-color: #f1c40f; color: white; border: none; padding: 8px 18px; border-radius: 6px; cursor: pointer; font-weight: 1000; transition: background 0.2s;">Edit</button>
                        <button onclick="deleteWorkoutPlan(${index})" style="background-color: #e74c3c; color: white; border: none; padding: 8px 18px; border-radius: 6px; cursor: pointer; font-weight: 1000; transition: background 0.2s;">Delete</button>
                    </div>
                `;
                container.appendChild(div);
            });
        }

        function redirectToDetails(index, editMode) {
            window.location.href = `WorkoutPlansDetails.html?index=${index}${editMode ? '&edit=true' : ''}`;
        }

        function deleteWorkoutPlan(index) {
            const workoutPlans = JSON.parse(localStorage.getItem('workoutPlans')) || [];
            workoutPlans.splice(index, 1); // Remove the workout plan by index
            localStorage.setItem('workoutPlans', JSON.stringify(workoutPlans));
            displayWorkoutPlans(); // Update the list visually
        }

        function startNewWorkoutPlan() {
            // Clear all relevant localStorage items
            localStorage.removeItem('workoutPlanTitle'); // Clear the workout plan title
            localStorage.removeItem('workoutExercises'); // Clear the list of exercises
            const savedExercises = JSON.parse(localStorage.getItem('workoutExercises')) || [];
            savedExercises.forEach((_, index) => {
                localStorage.removeItem(`exerciseData-${index}`); // Clear individual exercise data
            });

            // Redirect to the "Create Workout Plan" page
            window.location.href = "Create_Workout_Plan.html";
        }

        // Load the workout plans when the page loads
        window.onload = displayWorkoutPlans;
    </script>
    <script src="../js/language-dropdown.js"></script>

</body>
</html>
