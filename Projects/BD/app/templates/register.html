{% extends "base.html" %}

{% block content %}
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card">
                <div class="card-header bg-success text-white">
                    <h4><i class="bi bi-person-plus"></i> Registar</h4>
                </div>
                <div class="card-body">
                    <form method="POST">
                        <div class="mb-3">
                            <label for="nif" class="form-label">NIF</label>
                            <input type="number" class="form-control" id="nif" name="nif" required>

                            <label for="fname" class="form-label">Nome</label>
                            <input type="text" class="form-control" id="fname" name="fname" required>

                            <label for="lname" class="form-label">Apelido</label>
                            <input type="text" class="form-control" id="lname" name="lname">

                            <label for="email" class="form-label">Email</label>
                            <input type="email" class="form-control" id="email" name="email" required>

                            <label for="bdate" class="form-label">Data de nascimento</label>
                            <input type="date" class="form-control" id="bdate" name="bdate">

                            <label for="phone" class="form-label">Telefone</label>
                            <input type="text" class="form-control" id="phone" name="phone">

                            <label for="password" class="form-label">Password</label>
                            <input type="password" class="form-control" id="password" name="password" required>
                        </div>
                        <button type="submit" class="btn btn-success">Registar</button>
                    </form>

                    {% with messages = get_flashed_messages(with_categories=true) %}
                        {% if messages %}
                            {% for category, message in messages %}
                                <div class="alert alert-{{ category }} mt-3">{{ message }}</div>
                            {% endfor %}
                        {% endif %}
                    {% endwith %}
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
